services:
  - type: web
    name: crop-yield-api
    env: python
    plan: free
    rootDir: summative/API
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn prediction:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0