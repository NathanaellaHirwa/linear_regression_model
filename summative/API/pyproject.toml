[project]
name = "garment-productivity-api"
version = "0.1.0"
description = "FastAPI service that predicts a garment team's actual productivity and can be retrained from an uploaded CSV"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "python-multipart>=0.0.9",
    "scikit-learn==1.7.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
]

[tool.uv]
package = false
